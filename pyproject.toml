[project]
name = "funpush"
version = "1.0.6"
description = "消息推送工具库，目前支持钉钉机器人消息发送"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "farlog>=1.1.8", "requests>=2.28",]

[dependency-groups]
dev = [ "pytest>=8", "ruff>=0.8",]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funpush"
Releases = "https://github.com/farfarfun/funpush/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
license-files = []

[tool.hatch.build.targets.wheel]
packages = ["src/funpush"]
